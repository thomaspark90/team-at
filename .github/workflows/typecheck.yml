# 타입 체크 CI — Vercel 빌드는 타입 에러를 막지 않아(2026-08-08 topicEmails 건)
# 머지 전에 tsc 로 잡는다. 테스트가 생기면 여기에 잡을 것.
name: typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
